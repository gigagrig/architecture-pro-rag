services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    image: quantumforge-rag:task4
    env_file: .env
    environment:
      INDEX_DIR: /app/vector_index
      EMBEDDING_CACHE: /models
      LLM_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./vector_index:/app/vector_index:ro
      - ./.cache/embeddings:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
  bot:
    image: quantumforge-rag:task4
    command: ["python", "run_bot.py"]
    environment:
      RAG_API_URL: http://api:8000
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      BOT_API_TIMEOUT: ${BOT_API_TIMEOUT:-150}
    secrets:
      - telegram_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
secrets:
  telegram_token:
    file: ./telegram_bot_token.txt
volumes:
  ollama_models:
