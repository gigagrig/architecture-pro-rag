services:
  api:
    build: .
    image: quantumforge-rag:task4
    env_file: .env
    environment:
      INDEX_DIR: /app/vector_index
      EMBEDDING_CACHE: /models
      LLM_API_KEY_FILE: /run/secrets/yandex_api_key
    secrets:
      - yandex_api_key
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./vector_index:/app/vector_index:ro
      - ./.cache/embeddings:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
  bot:
    image: quantumforge-rag:task4
    command: ["python", "run_bot.py"]
    environment:
      RAG_API_URL: http://api:8000
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_token
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      BOT_API_TIMEOUT: ${BOT_API_TIMEOUT:-330}
    secrets:
      - telegram_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
secrets:
  yandex_api_key:
    file: ./yandex_ai_api_key.txt
  telegram_token:
    file: ./telegram_bot_token.txt
